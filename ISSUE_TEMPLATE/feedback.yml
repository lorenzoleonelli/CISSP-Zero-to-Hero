name: Chapter Feedback
description: Report a typo, suggest an improvement, or ask for clarification on a chapter
title: "[Feedback] "
labels: ["reader-feedback"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter / File
      description: Automatically filled if you clicked the link at the end of a chapter.
      placeholder: e.g., 2.1 Identify and classify information and assets
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feedback Type
      options:
        - Typo / Formatting error
        - Unclear explanation / Needs better example
        - Technical / CISSP concept correction
        - Missing topic / Suggestion
        - General praise / Positive feedback
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Paste the relevant sentence or describe your feedback.
      placeholder: Write your feedback here...
    validations:
      required: true
