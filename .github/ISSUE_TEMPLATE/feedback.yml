name: Chapter Feedback
description: Quick feedback on a chapter—pick an option and submit in seconds
title: "[Feedback] "
labels: ["reader-feedback"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter
      description: Pre-filled automatically from the chapter link.
      placeholder: e.g., 2.1 Identify and classify information and assets
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: What kind of feedback is this?
      options:
        - Typo or formatting fix
        - Unclear explanation or example needed
        - CISSP concept or exam alignment update
        - Suggestion or missing topic
        - Helpful chapter / positive note
    validations:
      required: true

  - type: checkboxes
    id: quick_checks
    attributes:
      label: Quick checks (optional)
      options:
        - label: I pasted the exact sentence or heading below
        - label: This affects exam / managerial judgment clarity
        - label: Happy for this to be referenced in a future update

  - type: textarea
    id: details
    attributes:
      label: Extra context (optional)
      description: Optional—add a sentence, quote, or note if helpful.
      placeholder: Optional details...
    validations:
      required: false
